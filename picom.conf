# PICOM CONFIGURATION (i3wm)

# --- [ RENDERING BACKEND ] ---
# Use GLX (OpenGL) for hardware acceleration and smooth performance
backend = "glx";
use-damage = true;
vsync = false;

# --- [ SHADOWS ] ---
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.5;
shadow-offset-x = -12;
shadow-offset-y = -12;

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- [ FADING ] ---
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 5;

fade-exclude = [];

# --- [ OPACITY & TRANSPARENCY ] ---
inactive-opacity = 0.9;
active-opacity = 0.95;
frame-opacity = 1.0;
inactive-opacity-override = true;

opacity-rule = [
  "100:class_g = 'Firefox'"
];

# --- [ CORNERS ] ---
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'"
];

# --- [ BLUR ] ---
blur-method = "dual_kawase";
blur-strength = 6;

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- [ ANIMATIONS ] ---
animations = true;
animation-stiffness = 300;
animation-window-mass = 0.7;
animation-dampening = 20;
animation-clamping = false;

# Animation presets for window actions
animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";
animation-for-workspace-switch-in = "slide-down";
animation-for-workspace-switch-out = "slide-up";

# Exclude certain windows from animations (e.g., Polybar)
animation-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# --- [ GENERAL SETTINGS ] ---
log-level = "warn";
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dmenu = { shadow = false; }
  popup_menu = { opacity = 0.95; }
  dropdown_menu = { opacity = 0.95; }
};
